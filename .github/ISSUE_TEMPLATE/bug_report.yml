name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - Desktop app (macOS)
        - Desktop app (Linux)
        - CLI
        - Building from source
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "Desktop: About Choros. CLI: choros --version. Source builds: the commit SHA."
      placeholder: "Version number or source commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and CPU architecture
      description: "Include the OS version (and Linux distribution) plus arm64 or x64. If a remote host is involved, include its OS and architecture too."
      placeholder: "e.g. macOS 15 arm64 or Ubuntu 24.04 x64"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version (if relevant)
      description: "For agent-related problems only, name the agent and its version, such as Claude Code or Codex. Otherwise leave this blank."
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: If you can't reproduce it reliably, describe what you were doing when it happened.
      placeholder: |
        1. Open a workspace
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Logs, screenshots, or recordings
      description: "Attach relevant evidence. Redact tokens, credentials, personal information, and private repository content before posting."
    validations:
      required: false
