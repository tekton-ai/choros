name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/tekton-ai/choros/issues) before posting. Keep this request focused on one problem; discuss larger changes here before implementing them. Small fixes can go directly to a PR; see [Contributing](https://github.com/tekton-ai/choros/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe where Choros falls short. Knowing the problem helps us find the right fix, even if it's different from what you propose.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you imagine this working? Rough ideas are fine.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
      description: Anything you tried, even if it didn't fully work.
    validations:
      required: false
