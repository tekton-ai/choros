name: Release CLI Lockstep

# GITHUB_TOKEN-created tags do not trigger push workflows. Explicit dispatch is
# retried whenever the same-SHA CLI release is still incomplete.
on:
  release:
    types: [published]

permissions:
  contents: write
  actions: write

# Separate from release-cli: a dispatcher must not hold its child's lock.
concurrency:
  group: release-cli-lockstep
  cancel-in-progress: false

jobs:
  tag-matching-cli:
    name: Tag matching cli-v release
    if: startsWith(github.event.release.tag_name, 'desktop-v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout released code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Resume matching CLI tag and dispatch
        run: bun scripts/release/github-release.ts lockstep
