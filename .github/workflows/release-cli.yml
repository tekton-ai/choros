name: Release CLI

# Tag pushes and lockstep dispatches build and validate the same caller SHA.
# Branch dispatches exercise the build/checks without publishing a release.
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read

# Every CLI version shares one writer for cli-latest. Never cancel a publisher.
concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    uses: ./.github/workflows/build-cli.yml
    with:
      targets: '[{"os":"ubuntu-latest","target":"linux-x64"},{"os":"macos-14","target":"darwin-arm64"},{"os":"macos-15-intel","target":"darwin-x64"},{"os":"ubuntu-24.04-arm","target":"linux-arm64"}]'
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: [build, validation]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/cli-v')
    permissions:
      contents: write
    outputs:
      is_newest: ${{ steps.pointer.outputs.is_newest }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: release-artifacts
          pattern: choros-*
          merge-multiple: true

      # CLI stays a prerelease so it cannot shadow desktop /releases/latest.
      # Uploads complete before publishing; retries preserve release ownership.
      - name: Publish or resume versioned release
        run: bun scripts/release/github-release.ts cli

      - name: Update rolling cli-latest release
        id: pointer
        run: bun scripts/release/github-release.ts cli-latest
