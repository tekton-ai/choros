name = "choros"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Public URL of THIS Worker — the /auth/desktop/success redirect target
# better-auth hands to GitHub/Google as callbackURL is built off this.
# We use the workers.dev URL instead of a custom domain on .top because
# GFW aggressively blocks .top TLDs at TLS SNI level from within China,
# and workers.dev is (currently) reachable there. Switch to a real
# .com/.io/.dev/.sh custom domain when we own one.
#
# Non-secret runtime config. packages/auth/src/server.ts + several top-level
# module initializers (Resend, Stripe, Redis, QStash, PostHog) read env at
# boot — every NEXT_PUBLIC_ below is required for the Worker to import
# without throwing, even if the value only points at a stub.
[vars]
AUTH_SELF_URL = "https://choros.xchunzhao.workers.dev"
NEXT_PUBLIC_API_URL = "https://choros.xchunzhao.workers.dev"
NEXT_PUBLIC_WEB_URL = "https://choros.xchunzhao.workers.dev"
NEXT_PUBLIC_ADMIN_URL = "https://choros.xchunzhao.workers.dev"
NEXT_PUBLIC_MARKETING_URL = "https://choros.xchunzhao.workers.dev"
NEXT_PUBLIC_COOKIE_DOMAIN = "choros.xchunzhao.workers.dev"
NEXT_PUBLIC_POSTHOG_KEY = "phc_fake_local_dev"
NEXT_PUBLIC_POSTHOG_HOST = "https://us.i.posthog.com"
# Dev workflow: this Worker doubles as the local dev backend, so it must be
# built with NODE_ENV=development set — see the "deploy" script in
# apps/auth/package.json. That unlocks these branches in
# packages/auth/src/server.ts (esbuild inlines process.env.NODE_ENV at build
# time; setting NODE_ENV in [vars] does NOT help):
#   • trustedOrigins gains http://localhost:5173 / 127.0.0.1:5173 for the vite
#     desktop dev server, plus exp:// for Expo mobile
#   • email/password sign-up stays enabled
#   • organization.afterCreate skips the Stripe customer creation call
# When we split dev vs prod Workers, drop the NODE_ENV=development wrapper on
# the prod side.

# Secrets — set with `wrangler secret put <NAME>` (do NOT commit values).
# Required for the Worker to boot / OAuth to succeed:
#
#   GH_CLIENT_ID
#   GH_CLIENT_SECRET
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   BETTER_AUTH_SECRET       (openssl rand -base64 32)
#   DATABASE_URL             (Neon pooled connection string)
#
# Required for the module-level SDK constructors not to throw at import.
# Real API calls never happen with these values in the OAuth flow, so
# fake placeholders are enough — see README.md for the exact values.
#
#   RESEND_API_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   QSTASH_TOKEN
#   KV_REST_API_URL
#   KV_REST_API_TOKEN
#   SLACK_BILLING_WEBHOOK_URL

# No custom-domain route: workers.dev URL is the canonical public URL
# for this Worker (see the block at the top of this file).

# Observability — free tier keeps 3 days of logs. Turn this on so you can
# inspect the OAuth kickoff/callback chain if it misbehaves in prod.
[observability]
enabled = true
